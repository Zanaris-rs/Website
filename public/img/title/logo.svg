<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Zanaris wordmark, 312x100 — the size of the logo it stands in for.

  Three stacked text layers make the bevel: a dark stroked base with a drop
  shadow, a mid-brown layer two pixels above it, and the gold-gradient face on
  top. `textLength` pins the width to 290px whatever serif the reader's system
  has, so the wordmark cannot outgrow its 312px box on a machine without
  Georgia.

  Kept as live <text> rather than outlined paths: no vector editor is installed
  here. Outlining is optional polish — see README, "The logo".
-->
<svg xmlns="http://www.w3.org/2000/svg" width="312" height="100" viewBox="0 0 312 100" role="img" aria-label="Zanaris">
  <title>Zanaris</title>
  <defs>
    <linearGradient id="zanaris-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.42" stop-color="#f4c542"/>
      <stop offset="0.74" stop-color="#b8860b"/>
      <stop offset="1" stop-color="#ffd76a"/>
    </linearGradient>
    <filter id="zanaris-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" letter-spacing="2" text-anchor="middle">
    <text x="156" y="74" textLength="290" lengthAdjust="spacingAndGlyphs" fill="#2b1a05" stroke="#2b1a05" stroke-width="6" stroke-linejoin="round" filter="url(#zanaris-shadow)">Zanaris</text>
    <text x="156" y="72" textLength="290" lengthAdjust="spacingAndGlyphs" fill="#5a3a0a">Zanaris</text>
    <text x="156" y="70" textLength="290" lengthAdjust="spacingAndGlyphs" fill="url(#zanaris-gold)" stroke="#7a5210" stroke-width="1">Zanaris</text>
  </g>
</svg>
